# regularization_off.yaml
# Same as gaussian_base, but with regularization block explicitly disabled.
# Use this to confirm that regularized methods with enabled=false reproduce
# the raw method results exactly.

domain:
  x_min: 0.0
  x_max: 1.0
  n_grid: 200

heat:
  alpha: 0.01
  T: 0.05
  dt: 0.001

initial_condition:
  type: gaussian
  mu: 0.4
  sigma0: 0.08
  amplitude: 1.0

grw:
  gradient_globs_per_jump: 20
  rng_seed: 0
  boundary: reflecting

experiments:
  run_naive_backward: true
  run_oracle_score_deterministic: true
  run_oracle_score_stochastic: false
  run_estimated_score_deterministic_raw: true
  run_estimated_score_stochastic_raw: false
  run_estimated_score_deterministic_regularized: true
  run_estimated_score_stochastic_regularized: false

safety:
  score_abs_fail_threshold: 1.0e6
  value_abs_fail_threshold: 1.0e6

regularization:
  enabled: false
  epsilon_floor:
    enabled: false
    value: 1.0e-6
    scale_by_peak: false
  score_clipping:
    enabled: false
    max_abs_score: 100.0
  smoothing:
    enabled: false
    method: gaussian
    sigma_grid_points: 2.0
