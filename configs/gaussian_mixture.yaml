domain:
  x_min: 0.0
  x_max: 1.0
  n_grid: 300

heat:
  alpha: 0.01
  T: 0.05
  dt: 0.001

initial_condition:
  type: gaussian_mixture
  background: 0.05
  components:
    - amplitude: 0.75
      mu: 0.35
      sigma0: 0.05
    - amplitude: 0.45
      mu: 0.62
      sigma0: 0.08

grw:
  gradient_globs_per_jump: 40
  rng_seed: 0
  boundary: reflecting

experiments:
  run_naive_backward: true
  run_oracle_score_deterministic: true
  run_oracle_score_stochastic: true
  run_estimated_score_deterministic_raw: true
  run_estimated_score_stochastic_raw: true

safety:
  score_abs_fail_threshold: 1.0e6
  value_abs_fail_threshold: 1.0e6
